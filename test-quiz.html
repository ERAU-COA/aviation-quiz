<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #f0f0f0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        .log { background: #222; color: #0f0; padding: 15px; border-radius: 4px; font-size: 12px; max-height: 400px; overflow-y: auto; margin: 20px 0; }
        .log-line { margin: 5px 0; }
        .log-error { color: #f00; }
        .log-success { color: #0f0; }
        .log-info { color: #0ff; }
        button { background: #1e40af; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; }
        button:hover { background: #1e3a8a; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Supabase Connection Test</h1>

        <div>
            <p>This page tests your Supabase connection directly.</p>
            <button onclick="testConnection()">Test Supabase Connection</button>
            <button onclick="testPasswordQuery()">Test Password Query (123456)</button>
            <button onclick="testAllQuizzes()">Fetch All Quizzes</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>

        <div id="status"></div>
        <div class="log" id="log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvagiezojxixpekknagk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YWdpZXpvanhpeHBla2tuYWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTg4ODUsImV4cCI6MjA5Mzg3NDg4NX0.kYyap46N4BXpA6w0qtA4zskABuX2GHjx77Cu6Zb96j4';

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const lineEl = document.createElement('div');
            lineEl.className = 'log-line log-' + type;
            lineEl.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
            logEl.appendChild(lineEl);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            statusEl.textContent = message;
        }

        async function testConnection() {
            log('Testing basic connection to Supabase...', 'info');
            try {
                const url = `${SUPABASE_URL}/rest/v1/quizzes`;
                log('URL: ' + url, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                log('Response status: ' + response.status, response.status === 200 ? 'success' : 'error');

                const data = await response.json();
                log('Response type: ' + typeof data, 'info');
                log('Response is array: ' + Array.isArray(data), 'info');
                log('Response length: ' + (Array.isArray(data) ? data.length : 'N/A'), 'info');
                log('Full response: ' + JSON.stringify(data).substring(0, 200), 'info');

                if (Array.isArray(data) && data.length > 0) {
                    showStatus('✓ Connected! Found ' + data.length + ' quiz(zes)', 'success');
                } else if (Array.isArray(data)) {
                    showStatus('⚠ Connected but no quizzes found', 'error');
                } else {
                    showStatus('✗ Unexpected response format', 'error');
                }
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
                showStatus('✗ Connection failed: ' + e.message, 'error');
            }
        }

        async function testPasswordQuery() {
            log('Testing password query for "123456"...', 'info');
            const password = '123456';

            try {
                const url = `${SUPABASE_URL}/rest/v1/quizzes?password=eq.${password}`;
                log('URL: ' + url, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                log('Response status: ' + response.status, response.status === 200 ? 'success' : 'error');

                const data = await response.json();
                log('Response is array: ' + Array.isArray(data), 'info');
                log('Response length: ' + (Array.isArray(data) ? data.length : 'N/A'), 'info');

                if (Array.isArray(data) && data.length > 0) {
                    log('FOUND QUIZ: ' + JSON.stringify(data[0]), 'success');
                    showStatus('✓ Password "123456" found in database!', 'success');
                } else {
                    log('No results for password query', 'error');
                    showStatus('✗ Password not found - check Supabase table', 'error');
                }
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
                showStatus('✗ Query failed: ' + e.message, 'error');
            }
        }

        async function testAllQuizzes() {
            log('Fetching all quizzes...', 'info');

            try {
                const url = `${SUPABASE_URL}/rest/v1/quizzes`;
                log('URL: ' + url, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (Array.isArray(data)) {
                    log('Found ' + data.length + ' quiz(zes)', 'info');
                    data.forEach((quiz, i) => {
                        log('Quiz ' + (i+1) + ': ID=' + quiz.id + ', Password=' + quiz.password + ', Name=' + quiz.name, 'info');
                    });
                    showStatus('✓ Retrieved ' + data.length + ' quizzes', 'success');
                } else {
                    log('Unexpected response: ' + JSON.stringify(data), 'error');
                    showStatus('✗ Unexpected response format', 'error');
                }
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
                showStatus('✗ Failed: ' + e.message, 'error');
            }
        }

        // Auto-run connection test on load
        window.addEventListener('load', () => {
            log('Page loaded. Click buttons to test.', 'info');
        });
    </script>
</body>
</html>
