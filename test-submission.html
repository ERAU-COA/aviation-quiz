<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Submission</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #f0f0f0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        .log { background: #222; color: #0f0; padding: 15px; border-radius: 4px; font-size: 12px; max-height: 500px; overflow-y: auto; margin: 20px 0; }
        .log-line { margin: 5px 0; }
        .log-error { color: #f00; }
        .log-success { color: #0f0; }
        .log-info { color: #0ff; }
        button { background: #1e40af; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; margin-right: 10px; }
        button:hover { background: #1e3a8a; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Test Quiz Submission</h1>
        <p>This tests whether submissions can be saved to Supabase.</p>

        <button onclick="testPostSubmission()">Test POST Submission</button>
        <button onclick="testGetSubmissions()">View All Submissions</button>
        <button onclick="clearLog()">Clear Log</button>

        <div id="status"></div>
        <div class="log" id="log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvagiezojxixpekknagk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YWdpZXpvanhpeHBla2tuYWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTg4ODUsImV4cCI6MjA5Mzg3NDg4NX0.kYyap46N4BXpA6w0qtA4zskABuX2GHjx77Cu6Zb96j4';

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const lineEl = document.createElement('div');
            lineEl.className = 'log-line log-' + type;
            lineEl.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
            logEl.appendChild(lineEl);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            statusEl.textContent = message;
        }

        async function testPostSubmission() {
            log('Testing submission POST...', 'info');

            try {
                const url = `${SUPABASE_URL}/rest/v1/submissions`;
                log('URL: ' + url, 'info');

                const submissionData = {
                    quiz_id: 1,
                    student_name: 'Test Student ' + Date.now(),
                    student_email: null,
                    time_taken_seconds: 123,
                    total_questions: 5,
                    score: 4
                };

                log('Payload: ' + JSON.stringify(submissionData), 'info');

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(submissionData)
                });

                log('Response status: ' + response.status, response.status >= 200 && response.status < 300 ? 'success' : 'error');

                const data = await response.json();
                log('Response: ' + JSON.stringify(data).substring(0, 300), 'info');

                if (response.status >= 200 && response.status < 300) {
                    if (Array.isArray(data) && data.length > 0) {
                        log('✓ Submission created with ID: ' + data[0].id, 'success');
                        showStatus('✓ Submission saved successfully!', 'success');
                    } else {
                        log('Response is array: ' + Array.isArray(data), 'info');
                        log('Array length: ' + (Array.isArray(data) ? data.length : 'N/A'), 'info');
                    }
                } else {
                    log('✗ Submission failed', 'error');
                    showStatus('✗ Failed to save submission', 'error');
                }
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
                showStatus('✗ Error: ' + e.message, 'error');
            }
        }

        async function testGetSubmissions() {
            log('Fetching all submissions...', 'info');

            try {
                const url = `${SUPABASE_URL}/rest/v1/submissions`;
                log('URL: ' + url, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                log('Response status: ' + response.status, response.status === 200 ? 'success' : 'error');

                const data = await response.json();

                if (Array.isArray(data)) {
                    log('Found ' + data.length + ' submission(s)', 'success');
                    data.forEach((sub, i) => {
                        log('  [' + (i+1) + '] ID=' + sub.id + ', Student=' + sub.student_name + ', Score=' + sub.score + '/' + sub.total_questions, 'info');
                    });
                    showStatus('✓ Retrieved ' + data.length + ' submissions', 'success');
                } else {
                    log('Unexpected response: ' + JSON.stringify(data), 'error');
                }
            } catch (e) {
                log('ERROR: ' + e.message, 'error');
                showStatus('✗ Error: ' + e.message, 'error');
            }
        }

        window.addEventListener('load', () => {
            log('Page loaded. Click buttons to test.', 'info');
        });
    </script>
</body>
</html>
