<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Aviation Leadership Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* PASSWORD SCREEN */
        .password-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .password-screen.hidden {
            display: none;
        }

        .password-header {
            flex: 0 0 auto;
            padding: 6vh 5vw;
            text-align: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
        }

        .password-header h1 {
            font-size: clamp(28px, 8vw, 48px);
            margin-bottom: 1vh;
            font-weight: 700;
        }

        .password-header p {
            font-size: clamp(16px, 4vw, 20px);
            opacity: 0.95;
        }

        .password-display-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5vh 5vw;
            gap: 1vw;
        }

        .password-digit {
            width: clamp(55px, 13vw, 85px);
            height: clamp(55px, 13vw, 85px);
            border: 3px solid #1e40af;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(28px, 7vw, 42px);
            font-weight: 700;
            color: #1e40af;
            background: #f0f4ff;
        }

        .password-digit.filled {
            background: #1e40af;
            color: white;
        }

        .keypad-container {
            flex: 1 1 auto;
            padding: 4vh 5vw;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        .keypad-row {
            display: flex;
            gap: 2vw;
            justify-content: center;
        }

        .key-button {
            width: clamp(60px, 25vw, 100px);
            height: clamp(60px, 25vw, 100px);
            border: none;
            border-radius: 14px;
            font-size: clamp(22px, 6vw, 36px);
            font-weight: 700;
            background: #e0e7ff;
            color: #1e40af;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-button:active {
            transform: scale(0.92);
            background: #c7d2fe;
        }

        .key-button.delete {
            background: #fecaca;
            color: #dc2626;
            font-size: clamp(16px, 4vw, 24px);
        }

        .key-button.delete:active {
            background: #fca5a5;
        }

        .key-button.submit {
            width: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            font-size: clamp(18px, 4vw, 24px);
        }

        .key-button.submit:active {
            background: linear-gradient(135deg, #172d6e 0%, #1a35a8 100%);
        }

        .key-button:disabled {
            background: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* NAME SCREEN */
        .name-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .name-screen.hidden {
            display: none;
        }

        .name-header {
            flex: 0 0 auto;
            padding: 8vh 5vw;
            text-align: center;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
        }

        .name-header h1 {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 700;
        }

        .name-input-area {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8vh 5vw;
            gap: 4vh;
        }

        .name-input-area input {
            width: 100%;
            padding: 4vh 5vw;
            font-size: clamp(20px, 5vw, 28px);
            border: 3px solid #047857;
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
        }

        .name-input-area input:focus {
            outline: none;
            border-color: #059669;
            background: #f0fdf4;
        }

        .name-button {
            padding: 3.5vh 5vw;
            font-size: clamp(18px, 5vw, 28px);
            font-weight: 700;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .name-button:active {
            transform: scale(0.96);
        }

        /* QUIZ SCREEN */
        .quiz-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .quiz-screen.hidden {
            display: none;
        }

        .quiz-header {
            flex: 0 0 auto;
            padding: 3vh 5vw;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-title {
            font-size: clamp(18px, 5vw, 26px);
            font-weight: 700;
        }

        .timer {
            font-size: clamp(26px, 6vw, 36px);
            font-weight: 800;
            background: rgba(255, 255, 255, 0.2);
            padding: 1.5vh 2.5vw;
            border-radius: 12px;
            min-width: 18vw;
            text-align: center;
        }

        .timer.warning {
            background: #fca5a5;
            color: #dc2626;
        }

        .progress-bar {
            height: 1vh;
            background: rgba(0, 0, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            transition: width 0.3s;
        }

        .question-area {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            padding: 4vh 5vw;
            overflow-y: auto;
        }

        .question-info {
            font-size: clamp(12px, 3vw, 16px);
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2vh;
            font-weight: 600;
        }

        .question-text {
            font-size: clamp(22px, 6vw, 32px);
            font-weight: 700;
            color: #111827;
            margin-bottom: 4vh;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        .option {
            padding: 3.5vh 4vw;
            border: 3px solid #e5e7eb;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 2vw;
        }

        .option:active {
            border-color: #7c3aed;
            background: #ede9fe;
        }

        .option.selected {
            background: #ede9fe;
            border-color: #7c3aed;
            color: #6d28d9;
        }

        .option input[type="radio"] {
            width: clamp(24px, 6vw, 32px);
            height: clamp(24px, 6vw, 32px);
            cursor: pointer;
            flex-shrink: 0;
        }

        .option label {
            flex: 1;
            cursor: pointer;
        }

        .quiz-actions {
            flex: 0 0 auto;
            padding: 3vh 5vw;
            display: flex;
            gap: 3vw;
        }

        .btn-back {
            padding: 2.5vh 4vw;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 600;
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-back:active {
            background: #e5e7eb;
        }

        .btn-submit {
            flex: 1;
            padding: 2.5vh 4vw;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-submit:active {
            transform: scale(0.96);
        }

        /* RESULTS SCREEN */
        .results-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 4vh 5vw;
            overflow-y: auto;
        }

        .results-screen.hidden {
            display: none;
        }

        .results-header {
            text-align: center;
            margin-bottom: 3vh;
        }

        .results-header h2 {
            font-size: clamp(26px, 6vw, 36px);
            color: #111827;
            margin-bottom: 2vh;
        }

        .score-display {
            font-size: clamp(56px, 16vw, 80px);
            font-weight: 900;
            color: #7c3aed;
            text-align: center;
            margin: 2vh 0;
        }

        .score-label {
            font-size: clamp(16px, 4vw, 22px);
            color: #6b7280;
            text-align: center;
            margin-bottom: 4vh;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 2vh;
            margin-bottom: 3vh;
        }

        .result-item {
            padding: 3vh 4vw;
            border-left: 5px solid #7c3aed;
            background: #f9f5ff;
            border-radius: 8px;
        }

        .result-item.correct {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .result-item.incorrect {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .result-question {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 700;
            color: #111827;
            margin-bottom: 1vh;
        }

        .result-answer {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #4b5563;
            margin-bottom: 0.5vh;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 3vh;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-12px); }
            20%, 40%, 60%, 80% { transform: translateX(12px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PASSWORD SCREEN -->
        <div class="password-screen" id="passwordScreen">
            <div class="password-header">
                <h1>✈️ Aviation Leadership</h1>
                <p>Enter Quiz Password</p>
            </div>

            <div class="password-display-area">
                <div class="password-digit" id="digit1"></div>
                <div class="password-digit" id="digit2"></div>
                <div class="password-digit" id="digit3"></div>
                <div class="password-digit" id="digit4"></div>
                <div class="password-digit" id="digit5"></div>
                <div class="password-digit" id="digit6"></div>
            </div>

            <div class="keypad-container">
                <div class="keypad-row">
                    <button class="key-button" onclick="addDigit(1)">1</button>
                    <button class="key-button" onclick="addDigit(2)">2</button>
                    <button class="key-button" onclick="addDigit(3)">3</button>
                </div>
                <div class="keypad-row">
                    <button class="key-button" onclick="addDigit(4)">4</button>
                    <button class="key-button" onclick="addDigit(5)">5</button>
                    <button class="key-button" onclick="addDigit(6)">6</button>
                </div>
                <div class="keypad-row">
                    <button class="key-button" onclick="addDigit(7)">7</button>
                    <button class="key-button" onclick="addDigit(8)">8</button>
                    <button class="key-button" onclick="addDigit(9)">9</button>
                </div>
                <div class="keypad-row">
                    <button class="key-button delete" onclick="deleteDigit()">← Delete</button>
                    <button class="key-button" onclick="addDigit(0)">0</button>
                </div>
                <button class="key-button submit" id="passwordSubmitBtn" onclick="checkPassword()" disabled>Check Password</button>
            </div>
        </div>

        <!-- NAME SCREEN -->
        <div class="name-screen hidden" id="nameScreen">
            <div class="name-header">
                <h1>✈️ Almost There</h1>
                <p>Enter Your Name</p>
            </div>

            <div class="name-input-area">
                <input type="text" id="studentName" placeholder="Type your name" autocomplete="off">
                <button class="name-button" onclick="submitName()">Begin Quiz</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div class="quiz-screen hidden" id="quizScreen">
            <div class="quiz-header">
                <div class="quiz-title" id="quizTitle">Quiz</div>
                <div class="timer" id="timer">5:00</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-area" id="questionsContainer"></div>

            <div class="quiz-actions">
                <button class="btn-back" id="backBtn" onclick="previousQuestion()" style="display:none;">← Back</button>
                <button class="btn-submit" onclick="submitQuiz()">Submit Quiz</button>
            </div>
        </div>

        <!-- RESULTS SCREEN -->
        <div class="results-screen hidden" id="resultsScreen">
            <div class="results-header">
                <h2>Quiz Complete! 🎉</h2>
            </div>
            <div class="score-display" id="scoreDisplay">0/0</div>
            <div class="score-label">Correct Answers</div>
            <div class="results-list" id="resultsList"></div>
            <button class="name-button" onclick="location.reload()">Take Another Quiz</button>
        </div>

        <!-- LOADING -->
        <div class="loading" id="loadingScreen" style="display:none;">
            <div class="spinner"></div>
            <p style="font-size:18px;font-weight:600;color:#374151;">Loading quiz...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://nvagiezojxixpekknagk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YWdpZXpvanhpeHBla2tuYWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTg4ODUsImV4cCI6MjA5Mzg3NDg4NX0.kYyap46N4BXpA6w0qtA4zskABuX2GHjx77Cu6Zb96j4';

        let supabase, passwordInput = '', currentQuiz = null, questions = [], studentAnswers = {};
        let startTime = null, timerInterval = null, currentQuestionIndex = 0, quizStarted = false;

        window.addEventListener('load', () => {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        });

        function addDigit(digit) {
            if (passwordInput.length < 6) {
                passwordInput += digit;
                updatePasswordDisplay();
            }
        }

        function deleteDigit() {
            passwordInput = passwordInput.slice(0, -1);
            updatePasswordDisplay();
        }

        function updatePasswordDisplay() {
            for (let i = 1; i <= 6; i++) {
                const el = document.getElementById(`digit${i}`);
                if (i <= passwordInput.length) {
                    el.textContent = '●';
                    el.classList.add('filled');
                } else {
                    el.textContent = '';
                    el.classList.remove('filled');
                }
            }
            document.getElementById('passwordSubmitBtn').disabled = passwordInput.length !== 6;
        }

        async function checkPassword() {
            try {
                const { data: quizzes, error } = await supabase.from('quizzes').select('*').eq('password', passwordInput);

                if (error) {
                    console.error('Supabase error:', error);
                    return;
                }

                if (!quizzes || quizzes.length === 0) {
                    const area = document.querySelector('.password-display-area');
                    area.style.animation = 'shake 0.4s';
                    setTimeout(() => { area.style.animation = ''; }, 400);
                    passwordInput = '';
                    updatePasswordDisplay();
                    return;
                }

                currentQuiz = quizzes[0];
                document.getElementById('passwordScreen').classList.add('hidden');
                document.getElementById('nameScreen').classList.remove('hidden');
                document.getElementById('studentName').focus();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function submitName() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) return;
            window.studentName = name;
            startQuiz();
        }

        async function startQuiz() {
            try {
                document.getElementById('nameScreen').classList.add('hidden');
                document.getElementById('loadingScreen').style.display = 'flex';

                const { data: qData, error } = await supabase.from('questions').select('*').eq('quiz_id', currentQuiz.id).order('question_number');

                if (error) {
                    console.error('Error loading questions:', error);
                    return;
                }

                questions = qData;
                studentAnswers = {};
                questions.forEach(q => { studentAnswers[q.id] = null; });

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('quizScreen').classList.remove('hidden');
                document.getElementById('quizTitle').textContent = currentQuiz.title;

                quizStarted = true;
                startTime = Date.now();
                currentQuestionIndex = 0;
                startTimer();
                renderQuestion();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const remaining = Math.max(0, 300 - elapsed);
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                const timerEl = document.getElementById('timer');
                timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
                if (remaining < 60) timerEl.classList.add('warning');
                if (remaining === 0) { clearInterval(timerInterval); submitQuiz(); }
            }, 1000);
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('progressFill').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';

            let html = `<div class="question-info">Question ${currentQuestionIndex + 1} of ${questions.length}</div>
                       <div class="question-text">${escapeHtml(q.question_text)}</div><div class="options">`;

            ['A','B','C','D'].forEach(l => {
                const opt = q[`option_${l.toLowerCase()}`];
                const sel = studentAnswers[q.id] === l;
                html += `<div class="option ${sel?'selected':''}" onclick="selectAnswer(${q.id},'${l}')">
                         <input type="radio" name="q${q.id}" value="${l}" ${sel?'checked':''}>
                         <label>${escapeHtml(opt)}</label></div>`;
            });
            html += '</div>';
            document.getElementById('questionsContainer').innerHTML = html;
            document.getElementById('backBtn').style.display = currentQuestionIndex > 0 ? 'block' : 'none';
        }

        function selectAnswer(qId, ans) {
            studentAnswers[qId] = ans;
            renderQuestion();
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        async function submitQuiz() {
            clearInterval(timerInterval);
            quizStarted = false;
            if (document.getElementById('quizScreen').classList.contains('hidden')) return;

            try {
                document.getElementById('quizScreen').classList.add('hidden');
                document.getElementById('loadingScreen').style.display = 'flex';

                const { data: sub, error: subError } = await supabase.from('submissions').insert([{
                    quiz_id: currentQuiz.id, student_name: window.studentName, student_email: null,
                    time_taken_seconds: Math.floor((Date.now() - startTime) / 1000),
                    total_questions: questions.length
                }]).select('id');

                if (subError) {
                    console.error('Error creating submission:', subError);
                    return;
                }

                const subId = sub[0].id;
                let correct = 0, results = [];

                for (const q of questions) {
                    const ans = studentAnswers[q.id];
                    const isCorrect = ans === q.correct_answer;
                    if (isCorrect) correct++;

                    const { error: ansError } = await supabase.from('student_answers').insert([{
                        submission_id: subId, question_id: q.id, student_answer: ans, is_correct: isCorrect
                    }]);

                    if (ansError) console.error('Error saving answer:', ansError);

                    results.push({ question: q.question_text, studentAnswer: ans, correctAnswer: q.correct_answer,
                        isCorrect: isCorrect, options: {A: q.option_a, B: q.option_b, C: q.option_c, D: q.option_d} });
                }

                const { error: updateError } = await supabase.from('submissions').update({score: correct}).eq('id', subId);
                if (updateError) console.error('Error updating score:', updateError);

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('resultsScreen').classList.remove('hidden');
                document.getElementById('scoreDisplay').textContent = `${correct} / ${questions.length}`;

                let rList = '';
                results.forEach((r, i) => {
                    const cls = r.isCorrect ? 'correct' : 'incorrect';
                    const icon = r.isCorrect ? '✓' : '✗';
                    rList += `<div class="result-item ${cls}"><div class="result-question">${icon} Q${i+1}: ${escapeHtml(r.question)}</div>
                              <div class="result-answer"><strong>Your:</strong> ${r.studentAnswer||'—'} – ${escapeHtml(r.options[r.studentAnswer]||'Not answered')}</div>
                              <div class="result-answer"><strong>Correct:</strong> ${r.correctAnswer} – ${escapeHtml(r.options[r.correctAnswer])}</div></div>`;
                });
                document.getElementById('resultsList').innerHTML = rList;
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function escapeHtml(t) {
            return t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
        }
    </script>
</body>
</html>
